<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>To-Do List</h1>

        <form id="task-form" novalidate>
            <input type="text" id="task-input" placeholder="Add a new task" autocomplete="off">
            <button type="submit" class="btn-primary">Add</button>
        </form>

        <p id="error-message" class="error" role="alert"></p>

        <div class="counter">
            <span>Total: <strong id="total-count">0</strong></span>
            <span>Remaining: <strong id="remaining-count">0</strong></span>
        </div>

        <div id="filters" class="filters">
            <button type="button" class="filter-btn active" data-filter="all">All</button>
            <button type="button" class="filter-btn" data-filter="active">Active</button>
            <button type="button" class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="task-list" class="task-list"></ul>

        <button type="button" id="clear-completed" class="btn-secondary">Clear completed</button>
    </main>

    <script src="script.js"></script>
</body>
</html>
